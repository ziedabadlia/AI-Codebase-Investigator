version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: codebase_investigator_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: codebase_investigator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
